# Per-domain extraction rules.
#   reference_sections:   level-2 section titles whose list items are endnotes
#   citation_templates:   templates that make a reference a 'template' citation
#                         (prefixes match the start of the name, exact match whole)
#   shorthand_templates:  standalone author-date templates ({{sfn}} family) that
#                         are references in their own right outside <ref> tags
# A domain without an entry uses the en.wikipedia.org rules.
en.wikipedia.org:
  reference_sections:
    - articles
    - audiobooks
    - bibliography
    - books
    - external links
    - further reading
    - references
    - sources
    - works cited
    - discography
    - see also
  citation_templates:
    prefixes:
      - cite
    exact:
      - citation
  shorthand_templates:
    - sfn
    - sfnp
    - sfnm
    - harvnb
    - harvp
    - harv
    - harvtxt
    - harvcol
    - harvcolnb
    - harvcoltxt
it.wikipedia.org:
  reference_sections:
    - note
    - bibliografia
    - fonti
    - collegamenti esterni
    - opere
    - discografia
    - pagine correlate
    - voci correlate
  citation_templates:
    prefixes:
      - cita
      - cite
    exact:
      - citazione
  shorthand_templates:
    - sfn
    - harvnb
af.wikipedia.org:
  reference_sections:
    - verwysing
    - verwysings
    - bibliografie
    - eksterne skakel
    - eksterne skakels
    - bronne
    - bron
    - notas
    - notas en verwysings
  citation_templates:
    prefixes:
      - cite
    exact:
      - verwysing
  shorthand_templates:
    - sfn
    - harvnb
